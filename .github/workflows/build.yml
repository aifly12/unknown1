name: Build preload.so

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      API: "32"
      PROJECT: "humane-aipin-45.20"
      TARGET_HEADER: "src/target_45_20.h"

    steps:
      - name: Setup Android NDK
        run: |
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r29-linux.zip"
          curl -SL --progress-bar "$NDK_URL" -o ndk.zip
          unzip -q ndk.zip -d $HOME/ndk
          rm ndk.zip
          
          NDK_HOME=$(find $HOME/ndk -maxdepth 2 -name "source.properties" | xargs dirname)
          echo "NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "NDK_ROOT=$NDK_HOME" >> $GITHUB_ENV

      - name: Build preload.so
        run: make preload

      - name: Upload preload.so
        uses: actions/upload-artifact@v4
        with:
          name: preload-${{ env.PROJECT }}
          path: build/${{ env.PROJECT }}/bin/preload.so
          if-no-files-found: error
