name: Build preload.so

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      API: "32"
      PROJECT: "humane-aipin-45.20"
      TARGET_HEADER: "src/target_45_20.h"

    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r29-linux.zip"
          mkdir -p "$HOME/ndk"
          curl -fsSL "$NDK_URL" -o "$RUNNER_TEMP/ndk.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$HOME/ndk"
          rm "$RUNNER_TEMP/ndk.zip"

          NDK_HOME="$(find "$HOME/ndk" -maxdepth 3 -name source.properties -print -quit | xargs dirname)"
          echo "NDK_ROOT=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Check target header
        run: test -f "$TARGET_HEADER"

      - name: Build preload.so
        run: make preload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: payload-so-output
          path: source/build/${{ env.PROJECT }}/bin/preload.so
          if-no-files-found: error
